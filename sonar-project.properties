# SonarCloud scanner configuration.
# sonar.projectKey and sonar.organization are injected by the CI pipeline via
# CLI args (secrets) — do not hardcode them here.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sources=apps,libs
sonar.tests=tests,apps/api/src,libs
sonar.test.inclusions=**/*.spec.ts,tests/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.typescript.tsconfigPath=tsconfig.json
